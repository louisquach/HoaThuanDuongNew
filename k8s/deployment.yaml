apiVersion: v1
kind: Namespace
metadata:
  name: hoathuanduong

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hoathuanduong
  namespace: hoathuanduong
  labels:
    app: hoathuanduong
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: hoathuanduong
  template:
    metadata:
      labels:
        app: hoathuanduong
    spec:
      nodeSelector:
        workload: primary
      containers:
        - name: hoathuanduong
          image: ghcr.io/louisquach/hoathuanduongnew:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
